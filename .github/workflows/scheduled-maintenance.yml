name: Catalog Maintenance (ISRC / covers / artist images)

# Woken by Supabase pg_cron -> /api/cron/trigger-worker-maintenance -> `repository_dispatch`.
# GitHub's own `schedule:` trigger is deliberately NOT used: GitHub disables scheduled workflows
# after 60 days without a commit, whereas `repository_dispatch` is unaffected.
on:
  repository_dispatch:
    types: [scheduled_maintenance]
  workflow_dispatch:

jobs:
  catalog-maintenance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Maintenance round
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          python -m app.cron.isrc_backfill
          python -m app.cron.cover_backfill
          python -m app.cron.artist_image_backfill
          python -m app.cron.catalog_backfill
          python -m app.cron.deezer_cover_backfill
