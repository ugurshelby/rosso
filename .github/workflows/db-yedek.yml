name: DB Yedek (Supabase dışına şifreli dump)

# NEDEN VAR (2026-09-17):
# Supabase'in kendi yedekleri, erişimini kaybedebileceğin HESABIN İÇİNDE durur.
# "Supabase hesabıma erişimi kaybettim" senaryosunda o yedekler de gider. Bu
# yüzden yedek Supabase'in DIŞINDA, ayrı bir kimlik alanında (GitHub) tutulur.
#
# Ayrıca ücretsiz Supabase planında point-in-time recovery yoktur — yani
# "dün 14:00'e dön" diyebileceğin bir mekanizma zaten yok. Bu workflow o boşluğu
# haftalık anlık görüntülerle doldurur.
#
# ZAMANLAMA (2026-10-24, web migration 0366): GitHub `schedule` KULLANILMAZ —
# repoya 60 gün push gelmezse GitHub onu durduruyordu. Pazar 04:00 UTC'de
# Supabase pg_cron (`rosso-db-yedek-cron` → `invoke_db_yedek()`) bu workflow'u
# `repository_dispatch` (`db_yedek`) ile uyandırır. Sonuç `pipeline_runs`'a
# (`db_yedek`) yazılır; sağlık nöbetçisi yedek 8 günden eskiyse ya da başarısızsa
# alarm verir. Elle çalıştırmak için `workflow_dispatch` duruyor.

on:
  repository_dispatch:
    types: [db_yedek]
  workflow_dispatch:

concurrency:
  group: db-yedek
  cancel-in-progress: false

jobs:
  yedek:
    runs-on: ubuntu-latest
    steps:
      - name: Postgres istemcisini kur
        # Supabase sunucusu Postgres 17; pg_dump sunucudan ESKİ olamaz, yoksa
        # "server version mismatch" ile durur. Bu yüzden 17 açıkça kuruluyor.
        #
        # ⚠ 2026-09-18: Yalnızca `apt-get install postgresql-client-17` YETMİYOR.
        # ubuntu-latest imajında zaten postgresql-client-16 kurulu ve PATH'te
        # onun dizini önde geliyor; 17 kurulsa bile `pg_dump` hâlâ 16'yı
        # çağırıyordu (kurulum adımı yeşil yandığı için sorun burada görünmüyor,
        # dump adımında patlıyordu). Çözüm: 17'nin bin dizinini GITHUB_PATH ile
        # PATH'in BAŞINA koymak ve sürümü adımın içinde doğrulamak.
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          # Doğrula: sonraki adım değil, BU adım patlasın ki sebep belli olsun.
          SURUM="$(/usr/lib/postgresql/17/bin/pg_dump --version)"
          echo "Kurulan pg_dump: $SURUM"
          case "$SURUM" in
            *"pg_dump (PostgreSQL) 17"*) ;;
            *)
              echo "::error::postgresql-client-17 kuruldu ama pg_dump 17 değil: $SURUM"
              exit 1
              ;;
          esac

      - name: Dump al, sıkıştır, şifrele
        env:
          # Tam bağlantı dizesi (session pooler, port 5432):
          #   postgresql://postgres.<ref>:<parola>@aws-0-<bolge>.pooler.supabase.com:5432/postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Simetrik şifreleme parolası. ⚠ BUNU KAYBEDERSEN YEDEK DE ÇÖPTÜR —
          # parola menajerinde, Supabase'den BAĞIMSIZ bir yerde sakla.
          YEDEK_PAROLA: ${{ secrets.YEDEK_PAROLA }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${YEDEK_PAROLA:-}" ]; then
            echo "::error::SUPABASE_DB_URL veya YEDEK_PAROLA secret'ı tanımsız — yedek alınamadı."
            exit 1
          fi

          DOSYA="rosso-yedek-$(date -u +%Y%m%d-%H%M).sql.gz.gpg"

          # PATH'te 16 önde kalmasın diye sürümü burada da yazdır — bir daha
          # aynı tuzağa düşersek log'dan tek bakışta anlaşılsın.
          pg_dump --version

          # --no-owner/--no-acl: geri yüklerken farklı bir projeye/role basmak
          # kolay olsun diye (yedeğin amacı tam da o: hesabı kaybettiysen YENİ
          # bir Supabase projesine geri yüklemek).
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl \
            --schema=public \
            --exclude-table-data='public.system_logs' \
          | gzip -9 \
          | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase "$YEDEK_PAROLA" \
                -o "$DOSYA"

          BOYUT=$(du -h "$DOSYA" | cut -f1)
          echo "Yedek alındı: $DOSYA ($BOYUT)"
          echo "YEDEK_DOSYA=$DOSYA" >> "$GITHUB_ENV"
          echo "YEDEK_BAYT=$(stat -c%s "$DOSYA")" >> "$GITHUB_ENV"
          # Sıfır baytlık/çöp bir dosyayı "başarı" sanmamak için asgari boyut kontrolü.
          if [ "$(stat -c%s "$DOSYA")" -lt 10000 ]; then
            echo "::error::Yedek şüpheli derecede küçük — dump başarısız olmuş olabilir."
            exit 1
          fi

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: rosso-db-yedek
          path: rosso-yedek-*.sql.gz.gpg
          # GitHub ücretsiz planında tavan 90 gün. Daha uzun saklamak istersen
          # artifact'i indirip kendi diskinde tut (bkz. geri yükleme rehberi).
          retention-days: 90
          if-no-files-found: error

      - name: Sonucu kaydet (başarılı)
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.pipeline_runs (run_type, outcome, stats) values ('db_yedek', 'success', jsonb_build_object('dosya', '${YEDEK_DOSYA}', 'bayt', ${YEDEK_BAYT}, 'calisma', ${{ github.run_id }}, 'tetik', '${{ github.event_name }}'))"

      - name: Sonucu kaydet (başarısız)
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.pipeline_runs (run_type, outcome, stats, error) values ('db_yedek', 'error', jsonb_build_object('calisma', ${{ github.run_id }}), 'GitHub Actions db-yedek çalışması ${{ github.run_id }} başarısız')" || true
